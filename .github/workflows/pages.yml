name: scrape and deploy
on:
  # 主要觸發：Mac 每 15 分鐘抓完 P9 推上來（data/p9.json）就跑，抓閃電並部署
  push:
    branches: [main]
  # 備援：Mac 沒開時，台北時間 07:07～00:52 每 15 分鐘一次；Mac 20 分鐘內推過就跳過，避免重複抓閃電
  schedule:
    - cron: '7,22,37,52 0-16,23 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 50 }
      - name: skip fallback run if the Mac pushed recently
        id: check
        run: |
          last=$(git log -1 --format=%ct -- data/p9.json || echo 0)
          age=$(( $(date +%s) - ${last:-0} ))
          echo "p9.json last pushed ${age}s ago"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 1200 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22 }
      - if: steps.check.outputs.skip != 'true'
        run: node test.mjs
      - if: steps.check.outputs.skip != 'true'
        run: node scrape.mjs
      - name: assemble site
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/slots.json _site/data/
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      # GitHub 偶爾發布失敗（找不到剛上傳的檔案），等 30 秒再試一次；兩次都失敗才算失敗
      - id: deploy
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
